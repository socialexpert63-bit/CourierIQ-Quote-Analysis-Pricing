<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CourierIQ – Quote Analysis &amp; Pricing</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#0f1f3d;--mut:#64708a;--line:#e2e7f0;--pri:#2851d8;--ok:#0f9d76;--warn:#d98a0b;--bad:#d1384b;--soft:#eef2ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1426;--card:#142038;--ink:#e8edf8;--mut:#93a0bc;--line:#243453;--soft:#1b2c52;color-scheme:dark}}
*{box-sizing:border-box}html{height:100%}body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
#app{display:flex;height:100%}
nav{width:218px;background:var(--card);border-right:1px solid var(--line);padding:14px 10px;overflow:auto;flex:none}
.logo{font-weight:700;font-size:19px;padding:4px 10px 14px}.logo b{color:var(--pri)}
nav a{display:block;padding:8px 10px;border-radius:7px;color:var(--mut);text-decoration:none;cursor:pointer;margin-bottom:1px}
nav a:hover{background:var(--soft)}nav a.on{background:var(--soft);color:var(--pri);font-weight:600}
main{flex:1;overflow:auto;padding:22px 26px;min-width:0}
h1{margin:0;font-size:22px}.sub{color:var(--mut);margin:2px 0 18px}
.demo{display:inline-block;background:#fff4dc;color:#8a5a00;padding:2px 8px;border-radius:99px;font-size:11px;margin-left:8px;vertical-align:middle}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(15,31,61,.05)}
.grid .card{margin:0}.k{font-size:24px;font-weight:700}.l{color:var(--mut);font-size:12px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px}tr.h:hover td{background:var(--soft);cursor:pointer}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:7px;cursor:pointer;transition:transform .1s,background .15s}
button:hover{background:var(--soft)}button:active{transform:scale(.97)}button.p{background:var(--pri);border-color:var(--pri);color:#fff}button.p:hover{opacity:.9}
button.g{background:var(--ok);border-color:var(--ok);color:#fff}button.r{color:var(--bad)}
input,select,textarea{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 9px;border-radius:7px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.ok{background:#dcf5ec;color:#0a7456}.wn{background:#fdefd2;color:#8a5a00}.bd{background:#fbe0e4;color:#a42336}.in{background:var(--soft);color:var(--pri)}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width .4s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--card);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.15);padding:20px;overflow:auto;transform:translateX(100%);transition:transform .25s;z-index:20}
.drawer.o{transform:none}
.md{position:fixed;inset:0;background:rgba(10,20,40,.5);display:none;align-items:center;justify-content:center;z-index:30}.md.o{display:flex}
.md>div{background:var(--card);padding:20px;border-radius:12px;width:min(420px,92%);animation:pop .2s}
@keyframes pop{from{transform:scale(.94);opacity:0}}
#toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transform:translateY(10px);transition:.25s;z-index:40}#toast.o{opacity:1;transform:none}
.paper{background:#fff;color:#0f1f3d;border:1px solid var(--line);padding:30px;max-width:640px;box-shadow:0 6px 24px rgba(0,0,0,.15);margin:10px 0}
.paper table td,.paper table th{border-color:#e2e7f0;color:#0f1f3d}
.edit{background:#fff8e1!important}.manual{color:var(--warn);font-size:11px;font-weight:700}
.stages{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.stages span{padding:5px 10px;border-radius:7px;background:var(--soft);font-size:12px}.stages span.a{background:var(--pri);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.65}}
@media(max-width:720px){nav{width:62px}nav a{font-size:0;padding:0;height:6px;margin:6px 8px;background:var(--line)}nav a.on{background:var(--pri)}.logo{font-size:0}main{padding:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{nav,.noprint{display:none}}
body{background:radial-gradient(1100px 500px at 80% -10%,#dfe8ff 0,transparent 60%),var(--bg)}
nav{background:linear-gradient(180deg,#0b1730,#17358a);border:0;box-shadow:6px 0 24px rgba(11,23,48,.3)}
nav .logo{color:#fff}nav a{color:#b9c6e8}nav a:hover{background:rgba(255,255,255,.12)}nav a.on{background:#2851d8;color:#fff;box-shadow:0 8px 16px rgba(40,81,216,.55);transform:translateZ(0) translateX(3px)}
.card{box-shadow:0 1px 0 #fff inset,0 10px 24px -12px rgba(15,31,61,.35);transition:transform .15s,box-shadow .25s;will-change:transform}
.grid .card:hover{box-shadow:0 22px 40px -14px rgba(40,81,216,.45)}
button.p{background:linear-gradient(180deg,#3a66ea,#2148c4);box-shadow:0 4px 0 #17348f,0 8px 14px rgba(40,81,216,.35)}button.p:active{transform:translateY(3px);box-shadow:0 1px 0 #17348f}
button.g{box-shadow:0 4px 0 #0a7456}button.g:active{transform:translateY(3px);box-shadow:none}
.iso{display:flex;justify-content:center;align-items:flex-end;padding:30px 0 10px;perspective:900px}.iso-in{display:flex;transform:rotateX(8deg) rotateY(-12deg);transform-style:preserve-3d;align-items:flex-end;background:linear-gradient(transparent 80%,rgba(40,81,216,.08));border-radius:12px;padding:0 24px}
.cube{position:relative;width:48px;height:var(--h);margin:0 30px 0 22px;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1)}
.cube i{position:absolute;display:block}.cube .f{inset:0;background:linear-gradient(90deg,var(--c),var(--c))}
.cube .s{left:100%;top:0;width:24px;height:100%;background:var(--c);filter:brightness(.68);transform-origin:left top;transform:skewY(-45deg)}
.cube .t{left:0;bottom:100%;width:100%;height:24px;background:var(--c);filter:brightness(1.3);transform-origin:left bottom;transform:skewX(-45deg)}
@keyframes grow{from{transform:scaleY(.05)}}
@media(max-width:720px){nav a{background:rgba(255,255,255,.25)}nav a.on{background:#fff}}
</style></head><body>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<div class="drawer" id="dr"></div><div class="md" id="md"><div id="mc"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),G=n=>'£'+Number(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const CATS=['Mainland','Specialist','Out-of-Hours','Crossing'],BASE=[160,320,260,410],PC=['SW1A 1AA','M1 1AE','B1 1AA','LS1 1UR','EH1 1YZ','BS1 4DJ','L1 8JQ','NE1 4ST'];
const SUP=['Northline Haulage','Pennine Express','Kestrel Freight','Albion Vans','Harbour Couriers'];
const jobs=[...Array(48)].map((_,i)=>{const c=i%4===3&&i%8!==3?0:i%4,b=BASE[c];const bids=[...Array(3+Math.floor(rnd()*4))].map((_,j)=>({s:SUP[(i+j)%5],a:Math.round(b*(.82+rnd()*.4)*(rnd()>.93?1.9:1)),d:`${1+i%27} Oct 2026`}));
return{id:'CQ-'+(10200+i),from:PC[i%8],to:PC[(i*3+1)%8],c,bids,dup:i%17===5}});
const S={approved:[true,false,false,false],rejected:[false,false,false,false],mk:[25,30,35,28],cleaned:false,notes:{},ext:{p:0,run:false,t:null,dup:0},pl:null,gen:{cust:false,int:false}};
const med=a=>{a=[...a].sort((x,y)=>x-y);const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
function stats(c){const all=jobs.filter(j=>j.c===c).flatMap(j=>j.bids.map(b=>b.a));const m=med(all),ok=all.filter(x=>x<=m*1.5),ex=all.length-ok.length;
return{n:all.length,ex,v:ok.length,avg:ok.reduce((a,b)=>a+b,0)/ok.length,med:med(ok),min:Math.min(...ok),max:Math.max(...ok),rec:Math.round(med(ok))}}
const ST=()=>CATS.map((_,i)=>stats(i));
const RT=[['London','Manchester',0,1.5],['Manchester','Leeds',0,.55],['Birmingham','Bristol',0,.8],['Edinburgh','Newcastle',0,1.1],['London','Glasgow',1,1.7],['Leeds','Liverpool',1,.9],['Bristol','Dublin',3,1.2],['London','Out-of-hours Bristol',2,1.0]];
function mkPL(){S.pl=RT.map((r,i)=>({o:r[0],d:r[1],c:r[2],f:r[3],price:null,manual:false,hist:[]}))}mkPL();
const cost=r=>Math.round(ST()[r.c].rec*r.f);const calc=r=>Math.ceil(cost(r)*(1+S.mk[r.c]/100));
function recalcAll(force){let conf=0;S.pl.forEach(r=>{if(!S.approved[r.c])return;if(r.manual&&!force){conf++;return}r.price=calc(r);r.manual=false});return conf}
recalcAll();
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('o');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('o'),2400)}
function modal(h,wire){$('#mc').innerHTML=h;$('#md').classList.add('o');wire&&wire($('#mc'))}const close=()=>$('#md').classList.remove('o');
const pill=(t,k)=>`<span class="pill ${k}">${t}</span>`;
function count(el,to,f=n=>Math.round(n).toLocaleString('en-GB')){let t0=null;const step=t=>{t0??=t;const p=Math.min(1,(t-t0)/700);el.textContent=f(to*p);if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
const PAGES={dash:'Dashboard',extract:'Data Extraction',jobs:'Job History',clean:'Data Cleaning',analysis:'Analysis & Calculations',approval:'Approval Centre',pricing:'Pricing Calculator',customer:'Customer Price List',internal:'Internal Price List',pdf:'PDF Documents',reports:'Reports & Analytics',settings:'Settings'};
const hd=(t,s)=>`<h1>${t}<span class="demo">Demonstration data</span></h1><p class="sub">${s}</p>`;
const V={};
function iso(st){const mx=Math.max(...st.map(s=>s.avg)),col=['#2851d8','#0f9d76','#d98a0b','#7a3fd1'];return `<div class="card"><b>3D cost map – average supplier cost by category</b><div class="iso"><div class="iso-in">${st.map((s,i)=>`<div style="text-align:center"><div class="l"><b>${G(s.avg)}</b></div><div style="height:26px"></div><div class="cube" style="--h:${Math.round(s.avg/mx*150)+20}px;--c:${col[i]}"><i class="f"></i><i class="s"></i><i class="t"></i></div><div class="l" style="margin-top:8px">${CATS[i]}</div></div>`).join('')}</div></div></div>`}
V.dash=()=>{const st=ST(),pend=S.approved.filter(a=>!a).length;const k=[['Total jobs analysed',12845],['Total quotations',38420],['Approved cost records',9640],['Pending reviews',126+pend],['Average supplier cost',184.5,1],['Active price lists',2]];
const pts=[40,46,44,52,58,55,63,70,66,74,79,83],mx=90,line=pts.map((v,i)=>`${i*50+10},${110-v*110/mx}`).join(' ');
return hd('Dashboard','Monitor subcontractor quotations, cost analysis, and pricing performance.')+`<div class="grid">${k.map((x,i)=>`<div class="card"><div class="l">${x[0]}</div><div class="k" data-c="${x[1]}" data-m="${x[2]||0}">0</div><div class="l" style="color:var(--ok)">+${(2+i*1.3).toFixed(1)}% vs last period</div></div>`).join('')}</div>
<div class="grid" style="grid-template-columns:2fr 1fr"><div class="card"><b>Quotation volume trend</b><svg viewBox="0 0 570 120" style="width:100%"><polyline points="${line}" fill="none" stroke="var(--pri)" stroke-width="3" stroke-dasharray="900" stroke-dashoffset="900"><animate attributeName="stroke-dashoffset" to="0" dur="1.2s" fill="freeze"/></polyline></svg></div>
<div class="card"><b>Pricing Intelligence</b><p>Mainland average supplier costs increased by 4.2%.</p><p>${18+pend} quotations need review.</p><p>${jobs.reduce((a,j)=>a+j.bids.filter(b=>b.a>BASE[j.c]*1.5).length,0)} possible outliers detected.</p></div></div>
${iso(st)}<div class="card" style="display:none"><b>Cost distribution</b><div class="row" style="margin-top:8px">${CATS.map((c,i)=>`<div style="flex:1;min-width:140px"><div class="l">${c}</div><div class="bar"><i style="width:${st[i].n/jobs.length*100/ 3}%"></i></div><b>${st[i].n}</b> quotes</div>`).join('')}</div></div>
<div class="card"><b>Recent activity</b><p>• 1,204 new quotations extracted</p><p>• ${jobs.filter(j=>j.dup).length} duplicate records detected</p><p>• Pricing rules updated by Priya Shah</p><p>• Customer price list v3 generated</p></div>`};
V.extract=()=>{const e=S.ext,stage=Math.min(4,Math.floor(e.p/25));return hd('Data Extraction','Collect and manage historical subcontractor quotations.')+`<div class="card"><b>Start new extraction</b><div class="row" style="margin-top:10px"><label>Start <input type="date" value="2026-01-01"></label><label>End <input type="date" value="2026-09-30"></label><select><option>Transport Exchange (simulated)</option></select>${pill('Not connected – demo mode','wn')}</div>
<div class="row"><label><input type="checkbox" checked> Include all available bids</label><label><input type="checkbox" checked> Resume previous extraction</label><label><input type="checkbox" checked> Skip previously imported</label></div>
<button class="p" onclick="extStart()">Start extraction</button> <button onclick="extPause()">${e.run?'Pause':'Resume'}</button> <button class="r" onclick="extCancel()">Cancel</button></div>
<div class="card"><div class="stages">${['Source account','Extraction','Duplicate detection','Validation','Database'].map((s,i)=>`<span class="${e.p>0&&e.p<100&&i===stage?'a':''}">${s}</span>`).join('→')}</div><div class="bar" style="margin:14px 0"><i style="width:${e.p}%"></i></div>
<div class="row"><span>Discovered <b>${Math.round(e.p*38.4).toLocaleString()}</b></span><span>Imported <b>${Math.round(e.p*37.6).toLocaleString()}</b></span><span>Duplicates skipped <b>${e.dup}</b></span><span>Failed <b>${e.p>60?3:0}</b></span><span>Page <b>${Math.ceil(e.p*1.9)}</b></span><span>Checkpoint <b>${Math.floor(e.p/10)*10}%</b></span></div></div>
<div class="card wrap"><b>Extraction history</b><table><tr><th>ID<th>Date range<th>Records<th>Duplicates<th>Status</tr>${[['EX-0042','Jan–Sep 2026',3840,212,'Completed','ok'],['EX-0041','Oct–Dec 2025',2910,148,'Completed','ok'],['EX-0040','Jul–Sep 2025',1220,64,'Failed','bd'],['EX-0039','Apr–Jun 2025',1800,90,'Paused','wn']].map(r=>`<tr><td>${r[0]}<td>${r[1]}<td>${r[2]}<td>${r[3]}<td>${pill(r[4],r[5])}</tr>`).join('')}</table></div>`};
function extTick(){const e=S.ext;if(!e.run)return;e.p=Math.min(100,e.p+2);e.dup+=Math.round(rnd()*3);if(e.p>=100){e.run=false;clearInterval(e.t);toast('Extraction complete (simulated)')}if(cur==='extract')render()}
function extStart(){const e=S.ext;clearInterval(e.t);e.p=0;e.dup=0;e.run=true;e.t=setInterval(extTick,250);toast('Simulated extraction started')}
function extPause(){const e=S.ext;if(e.p>0&&e.p<100){e.run=!e.run;if(e.run){clearInterval(e.t);e.t=setInterval(extTick,250)}render()}}
function extCancel(){const e=S.ext;clearInterval(e.t);e.run=false;e.p=0;render()}
let jq='';
V.jobs=()=>{const l=jobs.filter(j=>(j.id+j.from+j.to).toLowerCase().includes(jq.toLowerCase()));const nb=jobs.reduce((a,j)=>a+j.bids.length,0);
return hd('Job History','Browse historical jobs and subcontractor quotations.')+`<div class="grid"><div class="card"><div class="l">Total jobs</div><div class="k">${jobs.length}</div></div><div class="card"><div class="l">Total quotations</div><div class="k">${nb}</div></div><div class="card"><div class="l">Average bids per job</div><div class="k">${(nb/jobs.length).toFixed(1)}</div></div></div>
<div class="row"><input id="q" placeholder="Search job, pickup or delivery" value="${jq}" style="min-width:260px" oninput="jq=this.value;render();$('#q').focus();$('#q').setSelectionRange(jq.length,jq.length)"><button onclick="toast('CSV export (demo) – ${l.length} rows')">Export CSV</button></div>
<div class="card wrap"><table><tr><th>Job<th>Pickup<th>Delivery<th>Category<th>Bids<th>Lowest<th>Average<th>Status</tr>${l.map(j=>{const a=j.bids.map(b=>b.a);return`<tr class="h" onclick="openJob('${j.id}')"><td>${j.id}<td>${j.from}<td>${j.to}<td>${CATS[j.c]}<td>${a.length}<td>${G(Math.min(...a))}<td>${G(a.reduce((x,y)=>x+y,0)/a.length)}<td>${j.dup?pill('Duplicate','wn'):pill('Valid','ok')}</tr>`}).join('')}</table></div>`};
function openJob(id){const j=jobs.find(x=>x.id===id),m=med(j.bids.map(b=>b.a));$('#dr').innerHTML=`<button onclick="$('#dr').classList.remove('o')" style="float:right">Close</button><h2>${j.id}</h2><p>${j.from} → ${j.to}<br>${CATS[j.c]} journey</p><table><tr><th>Supplier<th>Quote<th>Submitted<th>Status</tr>${j.bids.map(b=>`<tr><td>${b.s}<td>${G(b.a)}<td>${b.d}<td>${b.a>m*1.5?pill('Outlier – excluded','bd'):pill('Included','ok')}</tr>`).join('')}</table><p class="l">Raw extracted data is kept unchanged; exclusions are recorded in the audit history.</p>`;$('#dr').classList.add('o')}
V.clean=()=>{const st=ST(),tot=st.reduce((a,s)=>a+s.n,0),ex=st.reduce((a,s)=>a+s.ex,0);
return hd('Data Cleaning','Validate, classify, and prepare quotation records for accurate cost analysis.')+`<div class="grid"><div class="card"><div class="l">Imported records</div><div class="k">${tot}</div></div><div class="card"><div class="l">Valid quotations</div><div class="k">${S.cleaned?tot-ex:'–'}</div></div><div class="card"><div class="l">Duplicate jobs</div><div class="k">${jobs.filter(j=>j.dup).length}</div></div><div class="card"><div class="l">Excluded (outliers)</div><div class="k">${S.cleaned?ex:'–'}</div></div></div>
<button class="p" onclick="S.cleaned=true;render();toast('Cleaning complete – raw data unchanged')">Run data cleaning</button><div class="grid" style="margin-top:14px">${CATS.map((c,i)=>`<div class="card"><b>${c}</b><div class="k">${st[i].n}</div><div class="l">${(st[i].n/tot*100).toFixed(0)}% of records · avg ${G(st[i].avg)}</div></div>`).join('')}</div>
<div class="card"><b>Cleaning rules</b>${['Detect duplicate jobs','Exclude missing quotation values','Exclude invalid routes','Exclude outliers above 1.5× median'].map(r=>`<p><label><input type="checkbox" checked> ${r}</label></p>`).join('')}</div>`};
V.analysis=()=>{const st=ST();return hd('Analysis & Calculations','Analyse approved quotation data and establish reliable subcontractor costs.')+`<button class="p" onclick="render();toast('Recalculated')">Recalculate</button><div class="card wrap" style="margin-top:14px"><table><tr><th>Category<th>Records<th>Excluded<th>Valid<th>Average<th>Median<th>Min<th>Max<th>Recommended<th>Status</tr>${st.map((s,i)=>`<tr><td>${CATS[i]}<td>${s.n}<td>${s.ex}<td>${s.v}<td>${G(s.avg)}<td>${G(s.med)}<td>${G(s.min)}<td>${G(s.max)}<td><b>${G(s.rec)}</b><td>${S.approved[i]?pill('Approved','ok'):pill('Pending','wn')}</tr>`).join('')}</table></div>
<div class="card"><b>Average cost by category</b>${st.map((s,i)=>`<p>${CATS[i]}<div class="bar"><i style="width:${s.avg/5}%"></i></div></p>`).join('')}<p class="l">Rule: recommended cost = median of valid quotes (outliers above 1.5× median removed). Placeholder rule until the client supplies formulas.</p></div>`};
V.approval=()=>{const st=ST();return hd('Approval Centre','Review and approve validated subcontractor cost data.')+`<div class="card wrap"><table><tr><th>Dataset<th>Category<th>Quotes<th>Average<th>Recommended<th>Status<th>Actions</tr>${st.map((s,i)=>`<tr><td>DS-${2601+i}<td>${CATS[i]}<td>${s.v}<td>${G(s.avg)}<td>${G(s.rec)}<td>${S.approved[i]?pill('Approved','ok'):S.rejected[i]?pill('Rejected','bd'):pill('Pending','wn')}<td>${S.approved[i]?'':`<button class="g" onclick="approve(${i})">Approve</button> <button class="r" onclick="reject(${i})">Reject</button>`}</tr>`).join('')}</table></div><div class="card"><b>Audit timeline</b><p>Data imported → Cleaning completed → Calculation performed → Reviewed by manager → Approved or rejected</p></div>`};
function approve(i){modal(`<h3>Approve ${CATS[i]} costs?</h3><p>Recommended cost ${G(stats(i).rec)} will become available for pricing.</p><button id="y" class="g">Approve</button> <button onclick="close()">Cancel</button>`,e=>e.querySelector('#y').onclick=()=>{S.approved[i]=true;S.rejected[i]=false;recalcAll();close();render();toast('Approved')})}
function reject(i){modal(`<h3>Reject ${CATS[i]}</h3><textarea id="rs" rows="3" style="width:100%" placeholder="Reason (required)"></textarea><p><button id="y" class="r">Reject</button> <button onclick="close()">Cancel</button></p>`,e=>e.querySelector('#y').onclick=()=>{if(!e.querySelector('#rs').value.trim())return toast('A reason is required');S.rejected[i]=true;close();render();toast('Rejected')})}
V.pricing=()=>{const st=ST();return hd('Pricing Calculator','Generate selling prices from approved subcontractor costs.')+`<div class="card"><div class="l">Example</div><div class="k">${G(100)} + ${S.mk[0]}% = ${G(100*(1+S.mk[0]/100))}</div></div>
<div class="card"><b>Markup by category</b>${CATS.map((c,i)=>`<div class="row" style="margin:10px 0 0"><span style="width:110px">${c}</span><input type="range" min="0" max="60" value="${S.mk[i]}" oninput="S.mk[${i}]=+this.value;this.nextElementSibling.textContent=this.value+'%';prev()"><b>${S.mk[i]}%</b></div>`).join('')}<p><button onclick="S.mk=S.mk.map(()=>25);render()">Apply 25% to all</button> <button class="p" onclick="applyMk()">Save &amp; generate price lists</button></p></div>
<div class="card wrap" id="pv"></div>`};
function prev(){const e=$('#pv');if(!e)return;e.innerHTML=`<table><tr><th>Category<th>Approved cost<th>Markup<th>Selling price</tr>${ST().map((s,i)=>`<tr><td>${CATS[i]}<td>${S.approved[i]?G(s.rec):'Awaiting approval'}<td>${S.mk[i]}%<td>${S.approved[i]?G(Math.ceil(s.rec*(1+S.mk[i]/100))):'–'}</tr>`).join('')}</table>`}
function applyMk(){const c=recalcAll();if(c)conflict(c);else toast('Price lists regenerated')}
function conflict(c){const r=S.pl.find(x=>x.manual&&S.approved[x.c]);modal(`<h3>Manual price protected</h3><p>${r.o} → ${r.d} has been manually adjusted to ${G(r.price)}. Calculated price would be ${G(calc(r))}. Keep the manual value or replace it?</p><button id="k" class="p">Keep manual price</button> <button id="rp" class="r">Replace with calculated</button>`,e=>{e.querySelector('#k').onclick=()=>{close();toast('Manual prices kept')};e.querySelector('#rp').onclick=()=>{r.hist.push({from:r.price,to:calc(r),why:'Replaced by calculation'});r.price=calc(r);r.manual=false;close();render();toast('Replaced')}})}
V.customer=()=>hd('Customer Price List','Manage and publish customer-facing courier prices.')+`<div class="row noprint"><button class="p" onclick="toast('Version v${4} saved')">Save version</button><button onclick="go('pdf')">Preview PDF</button><span class="l">Version 4 · saved by A. Khan</span></div><div class="card wrap"><table><tr><th>Origin<th>Destination<th>Category<th>Customer price<th>History</tr>${S.pl.map((r,i)=>`<tr><td>${r.o}<td>${r.d}<td>${CATS[r.c]}<td>${S.approved[r.c]?`<input id="p${i}" style="width:90px" value="${r.price}" onchange="editP(${i},this.value)" class="${r.manual?'edit':''}"> ${r.manual?'<span class="manual">MANUAL</span>':''}`:'Awaiting approval'}<td>${r.hist.length?r.hist.map(h=>`${G(h.from)}→${G(h.to)}`).join(', '):'–'}</tr>`).join('')}</table></div><button onclick="const c=recalcAll();c?conflict(c):toast('Recalculated');render()">Recalculate from approved costs</button>`;
function editP(i,v){const r=S.pl[i];v=Math.round(+v);if(!(v>0))return toast('Enter a valid price');r.hist.push({from:r.price,to:v,why:'Manual edit'});r.price=v;r.manual=true;render();toast('Price saved and protected from recalculation')}
V.internal=()=>hd('Internal Price List','Manage internal subcontractor costs and pricing reference values.')+`<div class="card wrap"><table><tr><th>Origin<th>Destination<th>Category<th>Supplier cost<th>Selling price<th>Markup<th>Markup %</tr>${S.pl.map(r=>{const c=cost(r);return`<tr><td>${r.o}<td>${r.d}<td>${CATS[r.c]}<td>${G(c)}<td>${S.approved[r.c]?G(r.price)+(r.manual?' <span class="manual">MANUAL</span>':''):'–'}<td>${S.approved[r.c]?G(r.price-c):'–'}<td>${S.approved[r.c]?((r.price/c-1)*100).toFixed(1)+'%':'–'}</tr>`}).join('')}</table></div>`;
V.pdf=()=>{const mk=(k,t)=>`<div class="card"><b>${t}</b> · v4 · ${S.pl.length} entries <div class="row" style="margin-top:8px"><button class="p" onclick="genPdf('${k}')">Generate PDF</button><button ${S.gen[k]?'':'disabled'} onclick="window.print()">Print / Save as PDF</button></div><div id="g${k}"></div>${S.gen[k]?paper(k):''}</div>`;return hd('PDF Documents','Preview, generate, and download professional pricing documents.')+mk('cust','Customer Price List')+mk('int','Internal Price List')};
function paper(k){const i=k==='int';return`<div class="paper">${i?'<div class="pill bd">CONFIDENTIAL – INTERNAL USE ONLY</div>':''}<h2 style="margin:8px 0">${i?'Internal Price List':'Courier Rate Card'}</h2><div class="l">[Company logo] · Version 4 · Effective 1 December 2026</div><table style="margin-top:10px"><tr><th>Route<th>Category${i?'<th>Cost':''}<th>Price</tr>${S.pl.filter(r=>S.approved[r.c]).map(r=>`<tr><td>${r.o} → ${r.d}<td>${CATS[r.c]}${i?`<td>${G(cost(r))}`:''}<td>${G(r.price)}</tr>`).join('')}</table><p class="l">Prices exclude VAT. Sample terms – demonstration only.</p></div>`}
function genPdf(k){const e=$('#g'+k);let p=0;const t=setInterval(()=>{p+=10;e.innerHTML=`<div class="bar" style="margin:10px 0"><i style="width:${p}%"></i></div><span class="l">${p<40?'Preparing document':'Rendering pages'}… ${p}%</span>`;if(p>=100){clearInterval(t);S.gen[k]=true;render();toast('PDF generated')}},150)}
V.reports=()=>{const st=ST();return hd('Reports & Analytics','Understand supplier costs, quotation patterns, and pricing performance.')+`<div class="grid"><div class="card"><div class="l">Average subcontractor cost</div><div class="k">${G(st.reduce((a,s)=>a+s.avg,0)/4)}</div></div><div class="card"><div class="l">Approval rate</div><div class="k">${S.approved.filter(Boolean).length*25}%</div></div><div class="card"><div class="l">Average markup</div><div class="k">${(S.mk.reduce((a,b)=>a+b)/4).toFixed(1)}%</div></div></div><div class="card"><b>Business insights</b><p>• Mainland delivery costs have changed by 5.2%.</p><p>• Crossing routes have fewer valid quotations.</p><p>• ${S.pl.filter(r=>r.manual).length} customer prices have been manually adjusted.</p><button onclick="toast('CSV export (demo)')">Download CSV</button></div>`};
V.settings=()=>hd('Settings','Manage application preferences, users, permissions, and system configuration.')+`<div class="card"><b>Company profile</b><p>Currency: GBP · Date format: DD/MM/YYYY</p></div><div class="card wrap"><b>Users</b><table><tr><th>Name<th>Role<th>Status</tr><tr><td>A. Khan<td>Administrator<td>${pill('Active','ok')}</tr><tr><td>P. Shah<td>Manager<td>${pill('Active','ok')}</tr><tr><td>J. Wright<td>Reviewer<td>${pill('Active','ok')}</tr></table></div><div class="card"><b>Extraction connection</b><p>Credentials: ●●●●●●●● (never shown) · ${pill('Not connected','wn')}</p></div>`;
let cur='dash';function go(p){location.hash=p}
function render(){$('#nav').innerHTML='<div class="logo">Courier<b>IQ</b></div>'+Object.keys(PAGES).map(k=>`<a class="${k===cur?'on':''}" onclick="go('${k}')">${PAGES[k]}</a>`).join('');const sc=$('#main').scrollTop;$('#main').innerHTML=V[cur]();$('#main').scrollTop=sc;$('#dr').classList.remove('o');prev();document.querySelectorAll('[data-c]').forEach(e=>{const m=e.dataset.m==='1';count(e,+e.dataset.c,m?G:undefined)})}
addEventListener('hashchange',()=>{cur=V[location.hash.slice(1)]?location.hash.slice(1):'dash';render()});
$('#md').onclick=e=>{if(e.target.id==='md')close()};cur=V[location.hash.slice(1)]?location.hash.slice(1):'dash';render();
if(!matchMedia('(prefers-reduced-motion:reduce)').matches){const M=$('#main');M.addEventListener('mousemove',e=>{const c=e.target.closest('.grid .card');if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(700px) rotateX(${-y*10}deg) rotateY(${x*12}deg) translateZ(8px)`});M.addEventListener('mouseout',e=>{const c=e.target.closest('.grid .card');if(c)c.style.transform=''})}
</script></body></html>
